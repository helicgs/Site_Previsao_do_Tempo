<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prvevisão do Tempo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js"></script>
</head>
<body>
    <div class="container01">
        <input class="input_cidade" type="text" id="Cidade" placeholder="Informar local:">

        <button class="botão-buscar" onclick="cliqueNoBotao()">
            <img class="img-busca" src="/imagens/Lupa.svg" alt="Botao de pesquisa">
        </button>

        <h2 class="cidaade" id="local">Tempo em São Paulo</h2>
        <p  class="temp" id="temperatura"> 21°C</p>

        <div  class="container02">
            <img class="img_previsao" src="https://openweathermap.org/img/wn/04n.png" alt=" icone do tempo">
            <p class="texto_previsao"  id="previsao do tempo">Nublado</p>           
        </div>
        <p class="umidade" id="umidade">Umidade: 70%</p>

    </div>
    <script></script>
    
</body>
</html>
